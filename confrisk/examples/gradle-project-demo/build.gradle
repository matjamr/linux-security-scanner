plugins {
    id 'java'
    id 'org.springframework.boot' version '2.6.0'
}

group = 'com.example.demo'
version = '1.0.0-SNAPSHOT'
sourceCompatibility = '11'

repositories {
    mavenCentral()
}

dependencies {
    // Example vulnerable dependencies for security testing
    implementation 'org.apache.logging.log4j:log4j-core:2.14.1'  // CRITICAL: Log4Shell
    implementation 'org.springframework:spring-core:5.3.5'        // CRITICAL: Spring4Shell
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.12.0'  // CRITICAL: Deserialization
    implementation 'commons-collections:commons-collections:3.2.1'  // CRITICAL: RCE

    // Safe dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ──────────────────────────────────────────────────────────────────────────
// Bramka bezpieczeństwa confrisk (Opcja A)
// Uruchamia confrisk-gradle i PRZERYWA build, gdy znajdzie zależność o ryzyku
// >= próg (--fail-on high). Dzięki temu np. `gradle build` / `./gradlew install`
// kończy się błędem, jeśli w build.gradle są zablokowane / podatne biblioteki.
//
// Wymagania:
//   1. confrisk-gradle na PATH (np. `cargo install --path <repo>/confrisk`)
//   2. Konfiguracja widoczna dla skanera — jedno z:
//        export CONFRISK_CONFIG_DIR=<repo>/confrisk/config     (dziedziczone przez Gradle)
//        lub skopiuj config do ~/.config/confrisk / /etc/confrisk
//        lub umieść katalog `config/` w katalogu projektu
//
// Uwaga: confrisk-gradle parsuje build.gradle, więc łapie zależności
// ZADEKLAROWANE WPROST (nie tranzytywne). Dla tranzytywnych użyj reguł
// resolutionStrategy (Opcja B).
// ──────────────────────────────────────────────────────────────────────────
def confriskScan = tasks.register('confriskScan', Exec) {
    group = 'verification'
    description = 'Bramka bezpieczeństwa: skan zależności confrisk-gradle (--fail-on high)'
    workingDir = projectDir
    commandLine 'confrisk-gradle',
                '--path', projectDir.toString(),
                '--asset', 'production',
                '--fail-on', 'high',
                '--exit-code'
    // Exec domyślnie przerywa build, gdy proces zwróci kod != 0.
}

// Wepnij bramkę przed kompilacją i przed typowymi zadaniami build/install
// (configureEach dotknie tylko tych zadań, które realnie istnieją w projekcie).
tasks.matching {
    it.name in ['compileJava', 'assemble', 'build', 'check',
                'install', 'publishToMavenLocal', 'publish', 'bootJar', 'jar']
}.configureEach {
    dependsOn confriskScan
}
